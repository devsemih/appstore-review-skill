schema_version: "1.1"
name: expo-subscription-app
description: >-
  Expo SDK 52 managed subscription app with 8 planted App Store violations (4.8, 5.1.1(v), 3.1.2 restore, 3.1.2 terms, camera purpose string, ATS, hardcoded secret, debug/staging) and 2 decoys.
tags: [appstore, expo, recall]
runs: 3
expected_outcome: See EXPECTED.md in this directory (answer key; not copied into the run workspace).
context:
  # Copies ./project into the empty run workspace. Needs --scaffold.
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1800
  append_system_prompt: >-
    When a skill or subagent returns an audit report, reproduce that full report
    verbatim as your final reply. Do not summarize, shorten, or reformat it.
