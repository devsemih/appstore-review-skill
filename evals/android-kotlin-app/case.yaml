schema_version: "1.1"
name: android-kotlin-app
description: >-
  Native Kotlin Android app with 7 planted Google Play policy violations (target API, QUERY_ALL_PACKAGES, background location disclosure, READ_MEDIA_IMAGES for avatar, account deletion, ads before UMP consent, cleartext traffic) and 1 decoy.
tags: [playstore, native, recall]
runs: 3
expected_outcome: See EXPECTED.md in this directory (answer key; not copied into the run workspace).
context:
  # Copies ./project into the empty run workspace. Needs --scaffold.
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1800
  append_system_prompt: >-
    When a skill or subagent returns an audit report, reproduce that full report
    verbatim as your final reply. Do not summarize, shorten, or reformat it.
