schema_version: "1.1"
name: flutter-ugc-app
description: >-
  Flutter chat app with 5 planted App Store violations (1.2 UGC moderation, ATT for AdMob, background location, Stripe for virtual coins, missing privacy manifest) and 2 decoys.
tags: [appstore, flutter, recall]
runs: 3
expected_outcome: See EXPECTED.md in this directory (answer key; not copied into the run workspace).
context:
  # Copies ./project into the empty run workspace. Needs --scaffold.
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1800
  append_system_prompt: >-
    When a skill or subagent returns an audit report, reproduce that full report
    verbatim as your final reply. Do not summarize, shorten, or reformat it.
